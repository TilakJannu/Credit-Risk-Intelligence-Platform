services:
  credit-risk-platform:
    build: .
    container_name: credit-risk-platform
    # Use standard array syntax for env_file to ensure compatibility across older Compose versions (v1 & v2 < 2.24)
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./documents:/app/documents
      # Mount the sql directory so the container has access to the schema and can read/write the database safely.
      - ./sql:/app/sql
    restart: unless-stopped
