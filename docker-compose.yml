services:
  credit-risk-platform:
    build: .
    container_name: credit-risk-platform
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./documents:/app/documents
      - ./credit_risk.db:/app/credit_risk.db
    restart: unless-stopped
